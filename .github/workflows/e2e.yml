name: E2E (Maestro, iOS Simulator)

# Deliberately not a PR gate.
#
# The flows drive the app against the public `demo.navidrome.org` server,
# because that is what gives a fresh install a library without shipping
# credentials to CI. That server is somebody else's, it rate-limits, and it is
# occasionally down — so a red run here means "look at this", not "your change
# is rejected". Gating merges on a third party's uptime teaches people to
# ignore the check, which is worse than not having it.
#
# `testIds.test.ts` runs in `pr-checks` and is the fast half of this: it cannot
# tell whether a flow passes, only that a renamed testID has not silently
# broken one. This job is the half that actually runs them.

on:
  workflow_dispatch:
  schedule:
    # Nightly, well clear of the release workflow's usual window.
    - cron: '0 9 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # Release rather than Debug: a Debug build expects Metro, and the flows
      # would then be testing a dev client's launcher. Release embeds the JS
      # bundle, so the simulator runs the app the way a person would get it.
      # No signing is involved for a simulator destination.
      #
      # Ad-hoc signed rather than unsigned. `CODE_SIGNING_ALLOWED=NO` builds an
      # app with no code signature at all, and the simulator's securityd then
      # refuses its keychain writes: `-34018, Client has neither
      # application-identifier nor keychain-access-groups entitlements`. Server
      # credentials live in the keychain, so onboarding connected to the demo
      # over the network and then could not save what it got — leaving the app
      # on the server-type screen and every suite after it skipped. An ad-hoc
      # signature needs no certificate and no team, which is what a laptop
      # build has been doing all along.
      #
      # `DEBUG_INFORMATION_FORMAT=dwarf` drops the dSYM bundle, which nothing
      # here reads: the flows either pass or hand back a screenshot, and no
      # crash log gets symbolicated. It is several gigabytes and a `lipo` of
      # every architecture at the end of an otherwise finished build — the
      # step that ran this machine out of disk when the same build was
      # verified locally.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Yuzic.xcworkspace \
            -scheme Yuzic \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            build \
            > /tmp/xcodebuild-e2e.log 2>&1 || {
              echo "::error::Simulator build failed — last 100 lines follow, full log uploaded."
              tail -100 /tmp/xcodebuild-e2e.log
              exit 1
            }

      # Chosen from what the image actually has rather than hard-coded. Runner
      # images change their installed simulators without warning, and a
      # hard-coded name turns that into a mystery failure months later.
      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices[][] | select(.isAvailable and (.name | test("iPhone")))]
            | last | .udid // empty
          ')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      # iOS offers its swipe-typing tutorial the first time a keyboard opens on
      # a fresh device — a card over the bottom of the screen, tab bar
      # included. The smoke flow taps into search and then back to Home, and
      # that tap landed on the tutorial instead, so the flow failed on an
      # assertion about Home while the app was working perfectly.
      #
      # Every runner is a fresh device, so this would greet every run.
      - name: Tell the keyboard we have seen its tutorial
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true

      - name: Install the app
        run: |
          app=$(find ios/build/Build/Products -maxdepth 3 -name 'Yuzic.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::Built app not found under ios/build/Build/Products."
            exit 1
          fi
          echo "Installing $app"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Every suite here signs in through demo.navidrome.org, so when that is
      # unreachable *from the runner* the first flow fails on an assertion
      # about the screen after connecting and the rest are skipped — which
      # reads as "onboarding is broken" and is not. Ask the server the same
      # two things the app asks, and say plainly which it is.
      - name: Probe the Navidrome demo
        run: |
          base="https://demo.navidrome.org/rest"
          args="u=demo&p=demo&v=1.16.1&c=Yuzic&f=json"
          for endpoint in ping getMusicFolders; do
            code=$(curl -s -o /tmp/probe-$endpoint.json -w '%{http_code}' --max-time 30 "$base/$endpoint?$args" || echo 000)
            status=$(python3 -c "import json,sys;print(json.load(open('/tmp/probe-$endpoint.json'))['subsonic-response']['status'])" 2>/dev/null || echo unparseable)
            echo "$endpoint: HTTP $code, subsonic status $status"
            if [ "$code" != "200" ] || [ "$status" != "ok" ]; then
              echo "::error::The Navidrome demo did not answer $endpoint from this runner (HTTP $code, status $status). Every E2E suite signs in through it, so this is the environment rather than the app."
              head -c 400 /tmp/probe-$endpoint.json || true
              exit 1
            fi
          done

      # Order matters and is the reason these are separate steps rather than
      # `npm run test:e2e`. `onboarding-demo` is the only flow that runs from a
      # fresh install, and it is what leaves the app connected to a server —
      # every flow after it opens with `clearState: false` and depends on the
      # state this one established.
      - name: Onboarding (connects to the Navidrome demo)
        run: maestro test .maestro/onboarding-demo.yaml

      - name: Smoke
        run: maestro test .maestro/smoke.yaml

      - name: Common user flows
        run: maestro test .maestro/common-user-flows.yaml

      - name: Detail flows
        run: maestro test .maestro/detail-flows.yaml

      # Maestro writes a screenshot and a view hierarchy for the step that
      # failed, which is the only thing that makes a red E2E run diagnosable
      # from a machine you cannot see. Collected into the workspace first:
      # `upload-artifact` does not expand `~`, and a path outside the
      # workspace is uploaded with its full directory structure.
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-output
          cp -R "$HOME/.maestro/tests" e2e-output/maestro 2>/dev/null || true
          cp /tmp/xcodebuild-e2e.log e2e-output/ 2>/dev/null || true
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot \
            e2e-output/simulator.png 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: e2e-output
          retention-days: 7
          if-no-files-found: ignore
