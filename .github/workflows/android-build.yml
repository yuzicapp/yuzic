name: Android Build

# Called by release-on-version-bump and nothing else — see the note in
# `ios-build.yml`. Both lost their `workflow_dispatch` together, so the two
# platforms cannot drift into shipping by different routes.
on:
  workflow_call:

concurrency: android-build

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    outputs:
      # The code Play actually gave this build; see the iOS workflow.
      version_code: ${{ steps.fastlane.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-

      # --omit=dev, not a plain `npm ci`. expo-dev-client and the launcher and
      # menu packages under it are devDependencies, but autolinking looks at
      # what is *installed* rather than at which list it came from — so a plain
      # install compiles expo.modules.devlauncher and devmenu into the release
      # APK. They were in the shipped 2.0.1 build for exactly this reason, and
      # F-Droid's scanner reads dev-launcher code in a release artifact as a
      # reason to call it non-free (rfp#3562). Excluding them in
      # `expo.autolinking` instead would be wrong: that key has no notion of
      # build type, so it would break `expo run:android` for development too.
      - name: Install Node dependencies
        run: npm ci --omit=dev

      # The --omit=dev above is why this check exists. `patch-package` was a
      # devDependency, so --omit=dev did not install it, and postinstall was
      # guarded on its binary being present — so from 2026-09-08 every release
      # build silently applied no patches at all, for seventeen days and three
      # releases. Nothing failed; the patches simply were not there. The fix is
      # patch-package being a production dependency, and this asserts the result
      # rather than trusting the mechanism.
      - name: Verify patches are applied
        run: ./tools/verify-patches.sh

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Read version from package.json
        id: version
        run: echo "label=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Run Fastlane Android build
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
          ANDROID_KEYSTORE_PATH: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        id: fastlane
        run: |
          set -o pipefail
          bundle exec fastlane android ci_android 2>&1 | tee /tmp/fastlane-android.log
          code=$(grep -o 'Using Android version code: [0-9]*' /tmp/fastlane-android.log | tail -1 | grep -o '[0-9]*$' || true)
          echo "version_code=${code:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuzic-android-apk
          path: android/app/build/outputs/**/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuzic-android-aab
          path: android/app/build/outputs/**/*.aab
