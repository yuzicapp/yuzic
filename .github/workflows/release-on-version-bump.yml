name: Release on Version Bump

on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag/release (e.g. 1.3.8). For backfilling a release that shipped before this workflow existed - does not trigger app builds."
        required: false
        type: string
      target:
        description: "Commit SHA or ref to tag (defaults to whatever commit this run is on)"
        required: false
        type: string

concurrency: release-on-version-bump

jobs:
  detect-version-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve version, change status, and target
        id: check
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(jq -r .version package.json)
            if git cat-file -e HEAD^:package.json 2>/dev/null; then
              OLD_VERSION=$(git show HEAD^:package.json | jq -r .version)
            else
              OLD_VERSION=""
            fi
            if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "target=${{ inputs.target || github.sha }}" >> "$GITHUB_OUTPUT"

  draft-release:
    name: Create draft release
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
          TARGET: ${{ needs.detect-version-bump.outputs.target }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            exit 0
          fi
          NOTES=$(printf '### **Version %s**\n\n#### What'"'"'s New\n- \n\n#### Bug Fixes\n- \n' "$VERSION")
          # Tag and title are different jobs. The tag is read by machines and
          # is `package.json`'s version verbatim; the title is read by people
          # and carries the product, like the engine's "yuzic-engine 1.2.1".
          # Creating the draft with the bare version left it to whoever
          # published to remember, and 2.12.0 and 2.13.0 both went out titled
          # "2.12.0" against forty releases called "Yuzic 2.11.0" and so on.
          gh release create "$VERSION" \
            --title "Yuzic $VERSION" \
            --notes "$NOTES" \
            --target "$TARGET" \
            --draft

  build-android:
    name: Ship Android build
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.changed == 'true' && github.event_name == 'push'
    uses: ./.github/workflows/android-build.yml
    secrets: inherit

  build-ios:
    name: Ship iOS build
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.changed == 'true' && github.event_name == 'push'
    uses: ./.github/workflows/ios-build.yml
    secrets: inherit


  # What actually shipped, in words, on the run's own summary page.
  #
  # AGENTS has three incidents behind this: 1.4.0 and 2.0.0 each shipped one
  # platform and were refused by the other, and 2.0.0's iOS half reported
  # success while uploading underneath a build TestFlight already had. The
  # lesson written there is that a failed release looks the same whether
  # nothing shipped or half of it did, and that the number that landed is the
  # thing to read rather than the tick. That check was a person's job until
  # now.
  verdict:
    name: Say what shipped
    needs: [detect-version-bump, build-android, build-ios]
    if: always() && needs.detect-version-bump.outputs.changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        env:
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_BUILD: ${{ needs.build-ios.outputs.build_number }}
          ANDROID_CODE: ${{ needs.build-android.outputs.version_code }}
        run: |
          set -euo pipefail
          verdict() {
            case "$1" in
              success) echo "shipped";;
              failure) echo "FAILED — nothing reached this store";;
              cancelled) echo "cancelled";;
              skipped) echo "did not run";;
              *) echo "$1";;
            esac
          }
          {
            echo "## Release $VERSION"
            echo
            echo "| Platform | Outcome | Number the store gave it |"
            echo "| --- | --- | --- |"
            echo "| iOS (TestFlight) | $(verdict "$IOS_RESULT") | ${IOS_BUILD:-unknown} |"
            echo "| Android (Play alpha) | $(verdict "$ANDROID_RESULT") | ${ANDROID_CODE:-unknown} |"
            echo
            if [ "$IOS_RESULT" = success ] && [ "$ANDROID_RESULT" = success ]; then
              echo "Both halves shipped. Check each number is above the last release's, then write the draft release."
              echo
              # The site is the only release note a user who is not on GitHub
              # ever reads, and it is nobody's job until it is written down: it
              # sat on 2.6.0 while 2.11.0 was on both stores. Expanded from the
              # Play note, which this release overwrote.
              echo "Then **publish this release to the site** — \`_pages/changelog.md\` in \`yuzic-web\`, with the \`Latest\` marker moved onto it. Expand it from \`fastlane/metadata/android/en-US/changelogs/default.txt\`, which the next release overwrites."
            else
              echo "**This release is incomplete.** Per AGENTS, the fix belongs on \`dev\` and has to be promoted before a re-run can succeed — do not re-run this blind."
            fi
            if [ "${IOS_BUILD:-unknown}" = unknown ] || [ "${ANDROID_CODE:-unknown}" = unknown ]; then
              echo
              echo "A number reads \`unknown\`, which means the store was never asked or the log line moved. Treat that as unverified rather than fine."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$IOS_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            echo "::error::Release $VERSION is incomplete — iOS: $IOS_RESULT, Android: $ANDROID_RESULT."
            exit 1
          fi

  # The draft is created before the builds and in parallel with them, so it
  # cannot carry their output — which is why 2.0.1 and 2.0.2 sat empty on the
  # releases page with the binaries reachable only from a workflow run that
  # expires. This runs after both and puts the same three files on the release
  # that the builds already uploaded as artifacts.
  #
  # `always()` so a half-failed release still publishes the half that worked:
  # one platform failing is not a reason to leave the other's build stranded,
  # and that has happened twice. The per-file `if` guards handle the missing
  # one. The release still has to be finished by hand — this attaches the
  # artifacts and leaves the notes to a person.
  attach-artifacts:
    name: Attach builds to the release
    needs: [detect-version-bump, draft-release, build-android, build-ios]
    if: always() && needs.detect-version-bump.outputs.changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach whatever built
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` reads GH_REPO, not GITHUB_REPOSITORY. Without it, `gh release
          # upload` shells out to git to work out which repo it is talking to,
          # and this job never checks the repo out — so it died with "fatal:
          # not a git repository" *after* both platforms had built and shipped,
          # leaving 2.1.1 an empty draft with three artifacts stranded on the
          # run. Setting GITHUB_REPOSITORY here looks right and does nothing.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p upload

          # Named as the store listings and the README's download links expect,
          # rather than as Gradle's `app-release.*` output. `|| true` on the
          # find keeps a missing platform from tripping `set -e`, and the copies
          # are written as `if` blocks rather than `&&` chains for the same
          # reason: a false test at the end of a step fails the step.
          IPA=$(find artifacts -name '*.ipa' | head -1 || true)
          APK=$(find artifacts -name '*.apk' | head -1 || true)
          AAB=$(find artifacts -name '*.aab' | head -1 || true)

          if [ -n "$IPA" ]; then cp "$IPA" upload/Yuzic.ipa; echo "ipa: $IPA"; else echo "no ipa (iOS did not produce one)"; fi
          if [ -n "$APK" ]; then cp "$APK" upload/Yuzic.apk; echo "apk: $APK"; else echo "no apk (Android did not produce one)"; fi
          if [ -n "$AAB" ]; then cp "$AAB" upload/Yuzic.aab; echo "aab: $AAB"; else echo "no aab (Android did not produce one)"; fi

          if [ -z "$(ls -A upload)" ]; then
            echo "No build artifacts found — both platforms failed. Nothing to attach."
            exit 0
          fi

          # --clobber so a re-run replaces rather than fails on an existing name.
          gh release upload "$VERSION" upload/* --clobber
          echo "Attached: $(ls upload | tr '\n' ' ')"
