name: iOS Build

# Called by release-on-version-bump and nothing else. There is deliberately
# no `workflow_dispatch`: a build that ships to TestFlight without a version
# behind it is a build nobody can point at afterwards, and the hand-run path
# existed mainly to test off `dev` — which is what the store kept refusing.
on:
  workflow_call:

concurrency: ios-build

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-26
    outputs:
      # The number App Store Connect actually gave this build, so the release
      # can state it rather than leaving it in a log nobody opens. AGENTS:
      # "a succeeded job is not a shipped release either".
      build_number: ${{ steps.fastlane.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --omit=dev for the same reason as the Android workflow: autolinking
      # links what is installed, not what is in `dependencies`, so a plain
      # `npm ci` puts expo-dev-client's pods into a release IPA. Development
      # builds run `expo run:ios` locally and install everything as usual.
      - name: Install Node dependencies
        run: npm ci --omit=dev

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Configure SSH for match repository
        run: |
          if [ -z "$MATCH_GIT_PRIVATE_KEY" ]; then
            echo "Missing MATCH_GIT_PRIVATE_KEY secret."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MATCH_GIT_PRIVATE_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
        env:
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Read version from package.json
        id: version
        run: echo "label=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Run Fastlane iOS build
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
          # Store screenshots follow a release, not every build. The upload
          # does the screenshots and the binary together, screenshots first,
          # so a refusal there loses the build after a full archive — which is
          # how 2.2.0 died and how two dispatches died on 2026-09-19.
          #
          # Every run of this workflow is now a release, so this is a constant.
          # It stays stated rather than deleted because the Fastfile tests the
          # string exactly: unset reads as false and silently skips the upload.
          # The guard still earns its keep for a `fastlane ci_ios` run from a
          # laptop, which has no business touching the public listing.
          YUZIC_UPLOAD_SCREENSHOTS: 'true'
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        id: fastlane
        run: |
          set -o pipefail
          bundle exec fastlane ios ci_ios 2>&1 | tee /tmp/fastlane-ios.log
          number=$(grep -o 'Using iOS build number: [0-9]*' /tmp/fastlane-ios.log | tail -1 | grep -o '[0-9]*$' || true)
          echo "build_number=${number:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /Users/runner/Library/Logs/gym/Yuzic-Yuzic.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuzic-ios
          path: build/ios/*.ipa
