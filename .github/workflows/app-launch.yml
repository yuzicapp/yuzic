name: App launches (iOS Simulator)

# The gate that runs the app.
#
# `pr-checks` never starts yuzic: lint, typecheck, jest and the architecture
# gates all pass on a build that cannot launch, and the 2.10.0 cycle produced
# two bugs of exactly that shape — a status bar with no readable pixels, and a
# player screen that rendered nothing until a phone window appeared. Both were
# obvious in a screenshot and invisible to every gate that ran.
#
# This is the smallest thing that closes it: build the app the way a person
# would get it, put it on a simulator, and check the first screen is really
# there. It asks nothing of any server — a fresh install lands on onboarding,
# which renders from the bundle alone — so unlike `e2e.yml` it can gate a merge
# without making somebody else's uptime a condition of shipping.
on:
  push:
    branches: [master, dev]
    paths-ignore: ['**/*.md', 'docs/**', '.maestro/**', 'fastlane/**']
  pull_request:
    branches: [master, dev]
    # A documentation change cannot stop the app launching, and this job is
    # thirty-odd minutes of somebody's runner.
    paths-ignore: ['**/*.md', 'docs/**', '.maestro/**', 'fastlane/**']

concurrency:
  group: app-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    name: Build and launch
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # The Xcode build is 37 of this job's 40 minutes from cold, and almost
      # all of it is pods and generated React Native sources that only change
      # when a dependency does. Keyed on the lockfiles for that reason; a miss
      # is the cold build, which is what the timeout allows for.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: ios/build
          key: ios-build-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ios-build-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}-
            ios-build-

      # Release, and ad-hoc signed, for the same reasons as the E2E build:
      # Release embeds the bundle so no Metro is involved, and an unsigned app
      # is refused the keychain by the simulator's securityd (-34018), which
      # breaks anything that stores a credential.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Yuzic.xcworkspace \
            -scheme Yuzic \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            > /tmp/xcodebuild-launch.log 2>&1 || {
              echo "::error::Simulator build failed — last 100 lines follow, full log uploaded."
              tail -100 /tmp/xcodebuild-launch.log
              exit 1
            }

      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items()):
              for d in items:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"])
          ' | tail -1)
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Install the app
        run: |
          app=$(find ios/build/Build/Products -maxdepth 3 -name 'Yuzic.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::Built app not found under ios/build/Build/Products."
            exit 1
          fi
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Launch it
        run: maestro test .maestro/launch.yaml

      # A crash report written while the app was up means it died and was
      # relaunched, which the flow above can still pass through.
      - name: Check for crashes
        if: always()
        run: |
          reports=$(find ~/Library/Logs/DiagnosticReports -name 'Yuzic*.ips' 2>/dev/null || true)
          if [ -n "$reports" ]; then
            echo "::error::The app left a crash report behind."
            for r in $reports; do echo "--- $r"; head -40 "$r"; done
            exit 1
          fi
          echo "No crash reports."

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/launch-diagnostics
          cp /tmp/xcodebuild-launch.log /tmp/launch-diagnostics/ 2>/dev/null || true
          cp -R ~/.maestro/tests /tmp/launch-diagnostics/maestro 2>/dev/null || true
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot /tmp/launch-diagnostics/screen.png 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-launch-diagnostics
          path: /tmp/launch-diagnostics
          retention-days: 7
