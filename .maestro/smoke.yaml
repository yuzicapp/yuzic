appId: com.arinora.rawarr
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "library-tab"
    timeout: 60000

- tapOn:
    id: "library-tab"
- assertVisible:
    id: "library-screen"

- tapOn:
    id: "home-tab"
- assertVisible:
    id: "home-screen"

- tapOn:
    id: "search-tab"
- assertVisible:
    id: "search-input"

# Focusing the search field opens the keyboard, and the keyboard covers the
# dock — so this tap used to land on a row of emoji rather than on Home.
- hideKeyboard

- tapOn:
    id: "home-tab"
- assertVisible:
    id: "home-screen"
